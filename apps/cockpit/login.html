<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Genug Analytics — Sign in</title>
    <!-- Not deferred, as on the cockpit page: it sets the theme before
         the page is drawn, so the wrong theme doesn't flash. -->
    <script src="theme.js"></script>
    <link rel="stylesheet" href="cockpit.css" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <script src="login.js" defer></script>
  </head>
  <body class="login-body">
    <main class="login-card">
      <div class="brand">
        <span class="brand-mark">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 3v18h18"></path>
            <path d="m7 14 4-5 3 3 5-7"></path>
          </svg>
        </span>
        <div>
          <h1>Cockpit</h1>
          <p class="brand-sub">Genug Analytics</p>
        </div>
      </div>

      <!-- A real form with a password input, although login.js sends it
           with fetch(): password managers look for this. A normal form
           submit would be blocked by the CSP (form-action 'none'). -->
      <form id="login-form" class="login-form">
        <!-- There is no username, but browsers and password managers
             handle a password field alone badly (Chrome warns, and a
             manager has no name to save it under). This fixed, hidden
             field gives them one; it is never sent. -->
        <input
          type="text"
          name="username"
          value="cockpit"
          autocomplete="username"
          readonly
          hidden
        />
        <label for="password">Cockpit password</label>
        <input
          type="password"
          id="password"
          name="password"
          autocomplete="current-password"
          autofocus
          required
          aria-describedby="password-hint message"
        />
        <p class="login-hint" id="password-hint">
          The <code>COCKPIT_PASSWORD</code> set in this deployment's
          environment.
        </p>
        <button id="submit" type="submit">Sign in</button>
      </form>

      <!-- Always present, never `hidden`: a live region that only appears
           when unhidden may not be announced at all. It is empty when
           there is nothing to say. The password field's aria-describedby
           points at it, so after a failed sign-in, when focus returns to
           the field, the reason is read out. -->
      <p class="login-message" id="message" role="status"></p>
    </main>
  </body>
</html>
