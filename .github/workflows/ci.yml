name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: npm ci

      - run: npm run build

      # The same command contributors run locally, so CI tests exactly
      # what `npm test` tests.
      - run: npm test

      - run: npm run lint

      - run: npm run format:check

  # Only runs when a release tag is pushed (`git push --follow-tags`, see
  # docs/releasing.md); a normal push to main only builds and tests.
  # `needs` makes it wait for build-and-test, so a tag that fails its
  # tests is never published to ghcr.io.
  publish-image:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only this job may push packages, so the permission is set here,
      # not for the whole workflow.
      packages: write
    steps:
      - uses: actions/checkout@v5

      # The release job below uses this version's CHANGELOG.md section as
      # the release notes. Checked before publishing, so a tag without a
      # changelog entry never becomes an image.
      - run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > /dev/null

      - uses: docker/setup-buildx-action@v4

      # For GITHUB_TOKEN to push, the repo must be added with Write access
      # in the package's settings: Package → Manage Actions access → Add
      # Repository. Linking the package to the repo or "Inherit access
      # from source repository" is not enough. A recreated package needs
      # this again.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Sets the Dockerfile's `ARG GENUG_VERSION`, so the server
          # reports the same version the image is tagged with.
          build-args: GENUG_VERSION=${{ github.ref_name }}
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}

  # Creates a GitHub Release, because people watching the repo are only
  # notified about Releases, not tags. Runs after publish-image, so a
  # Release never announces an image that doesn't exist yet. gh is
  # preinstalled on the runner.
  release:
    needs: publish-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md

      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
